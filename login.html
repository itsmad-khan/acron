<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="google-adsense-account" content="pub-8085542523004870">
<title>acron — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="CSS/style.css"/>
<style>
  :root {
    --bg:           #0d0f1a;
    --bg-2:         #131629;
    --surface:      #1a1e32;
    --surface-2:    #1f2438;
    --border:       rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.13);
    --text-primary:   #f0f2ff;
    --text-secondary: #8b92b8;
    --text-muted:     #525878;
    --accent:       #7c6cf0;
    --accent-light: #9d90f5;
    --teal:         #34d399;
    --rose:         #f87171;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --transition: 200ms cubic-bezier(0.4,0,0.2,1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }

  /* ── Navbar ── */
  .navbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; height: 64px;
    background: rgba(13,15,26,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), #5b4dd4);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    color: #fff; box-shadow: 0 4px 12px rgba(124,108,240,0.4);
  }
  .logo-name { display: block; font-size: 17px; font-weight: 800; color: var(--text-primary); line-height: 1.1; letter-spacing: -0.3px; }
  .logo-urdu { display: block; font-size: 11px; color: var(--text-secondary); line-height: 1; }
  .nav-right { display: flex; align-items: center; gap: 8px; }
  .theme-toggle {
    width: 36px; height: 36px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-secondary); display: flex; align-items: center;
    justify-content: center; cursor: pointer;
    transition: background var(--transition), color var(--transition);
  }
  .theme-toggle:hover { background: var(--surface-2); color: var(--text-primary); }
  .lang-switch {
    display: flex; background: var(--surface);
    border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px;
  }
  .lang-btn {
    padding: 4px 12px; border-radius: 6px; border: none;
    background: transparent; color: var(--text-secondary);
    font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background var(--transition), color var(--transition);
  }
  .lang-btn.active { background: var(--accent); color: #fff; }

  /* ── Auth layout ── */
  .auth-main {
    position: relative; z-index: 1;
    min-height: calc(100vh - 64px);
    display: flex; align-items: center; justify-content: center;
    padding: 40px 16px;
  }

  .auth-card {
    width: 100%; max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 36px 32px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }

  /* ── Card top ── */
  .auth-top {
    display: flex; flex-direction: column; align-items: center;
    gap: 8px; margin-bottom: 28px; text-align: center;
  }

  .auth-icon {
    width: 56px; height: 56px; border-radius: 16px;
    background: rgba(124,108,240,0.12);
    border: 1px solid rgba(124,108,240,0.2);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-light);
    margin-bottom: 4px;
  }

  .auth-title {
    font-size: 22px; font-weight: 800;
    color: var(--text-primary); letter-spacing: -0.4px;
  }

  .auth-sub {
    font-size: 14px; color: var(--text-secondary); font-weight: 500;
  }

  /* ── Form groups ── */
  .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }

  .form-label {
    font-size: 13px; font-weight: 700;
    color: var(--text-secondary); letter-spacing: 0.2px;
  }

  .input-wrap { position: relative; display: flex; align-items: center; }

  .input-icon {
    position: absolute; left: 13px;
    color: var(--text-muted); pointer-events: none;
    transition: color var(--transition);
  }

  .form-input {
    width: 100%;
    background: var(--bg-2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px 12px 40px;
    color: var(--text-primary);
    font-family: 'Nunito', sans-serif;
    font-size: 14px; font-weight: 500;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
    min-height: 48px;
  }

  .form-input::placeholder { color: var(--text-muted); }

  .form-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,108,240,0.15);
  }

  .form-input:focus + .input-icon,
  .input-wrap:focus-within .input-icon { color: var(--accent-light); }

  /* Fix icon color on focus — icon is before input in DOM */
  .input-wrap:focus-within .input-icon { color: var(--accent-light); }

  .form-input.error { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(248,113,113,0.12); }

  /* Password eye toggle */
  .eye-btn {
    position: absolute; right: 12px;
    width: 32px; height: 32px; border-radius: 7px;
    border: none; background: transparent;
    color: var(--text-muted); cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: color var(--transition), background var(--transition);
  }
  .eye-btn:hover { color: var(--text-secondary); background: var(--surface); }

  /* Password input needs right padding for eye icon */
  #inp-pass { padding-right: 48px; }

  .field-error {
    font-size: 12px; font-weight: 600; color: var(--rose);
    min-height: 16px; display: block;
    animation: shake 0.3s ease;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%      { transform: translateX(-4px); }
    75%      { transform: translateX(4px); }
  }

  /* ── Forgot password ── */
  .forgot-row {
    display: flex; justify-content: flex-end;
    margin-top: -8px; margin-bottom: 4px;
  }
  .forgot-link {
    font-size: 12px; font-weight: 700;
    color: var(--accent-light); text-decoration: none;
    transition: color var(--transition);
  }
  .forgot-link:hover { color: var(--text-primary); }

  /* ── Submit button ── */
  .submit-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 13px 24px; margin-top: 8px;
    border-radius: var(--radius-md); border: none;
    background: linear-gradient(135deg, var(--accent), #5b4dd4);
    color: #fff; font-family: 'Nunito', sans-serif;
    font-size: 15px; font-weight: 800; cursor: pointer;
    transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
    box-shadow: 0 4px 16px rgba(124,108,240,0.4);
    min-height: 50px; letter-spacing: 0.2px;
  }

  .submit-btn:disabled {
    background: var(--surface-2); color: var(--text-muted);
    cursor: not-allowed; box-shadow: none; opacity: 1;
  }

  .submit-btn:not(:disabled):hover {
    opacity: 0.92; transform: translateY(-1px);
    box-shadow: 0 6px 22px rgba(124,108,240,0.5);
  }

  .submit-btn:not(:disabled):active { transform: translateY(0); }

  /* Loading spinner inside button */
  .btn-spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .submit-btn.loading .btn-spinner { display: block; }
  .submit-btn.loading .btn-text-wrap { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Divider ── */
  .auth-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 20px 0; color: var(--text-muted); font-size: 12px; font-weight: 600;
  }
  .auth-divider::before,
  .auth-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  /* ── Bottom text ── */
  .login-text {
    text-align: center; font-size: 13px;
    color: var(--text-muted); margin-top: 18px; font-weight: 500;
  }
  .login-text a {
    color: var(--accent-light); font-weight: 700;
    text-decoration: none; transition: color var(--transition);
  }
  .login-text a:hover { color: var(--text-primary); }

  /* ── Light mode ── */
  body.light-mode {
    --bg: #f4f6fb; --bg-2: #eef0f7; --surface: #ffffff; --surface-2: #f0f2fa;
    --border: rgba(0,0,0,0.08); --border-hover: rgba(0,0,0,0.14);
    --text-primary: #1a1d2e; --text-secondary: #5a6080; --text-muted: #9ba3c0;
  }

  @media (max-width: 480px) {
    .auth-card { padding: 28px 20px; border-radius: 18px; }
    .navbar { padding: 0 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<nav class="navbar" role="navigation" aria-label="Main navigation">
  <a href="index.html" class="logo" aria-label="Acron home">
    <div class="logo-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div>
      <span class="logo-name">Acron</span>
      <span class="logo-urdu">علم کی راہ</span>
    </div>
  </a>
  <div class="nav-right">
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()"
            title="Switch theme" aria-label="Toggle light/dark theme">
      <svg id="theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg id="theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none" aria-hidden="true">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
    <div class="lang-switch" role="group" aria-label="Language selection">
      <button class="lang-btn active" onclick="setLang('en')" id="btn-en" aria-pressed="true">English</button>
      <button class="lang-btn" onclick="setLang('ur')" id="btn-ur" aria-pressed="false">اردو</button>
    </div>
  </div>
</nav>

<main class="auth-main" id="main-content">
  <div class="auth-card" role="region" aria-label="Login form">

    <div class="auth-top">
      <div class="auth-icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
      </div>
      <h1 class="auth-title" id="txt-login-title">Welcome back!</h1>
      <p class="auth-sub" id="txt-login-sub">Log in to continue studying</p>
    </div>

    <!-- Email -->
    <div class="form-group">
      <label class="form-label" for="inp-email" id="lbl-email">Email address</label>
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <input type="email" id="inp-email" class="form-input"
               placeholder="your@email.com"
               autocomplete="email"
               oninput="validateLogin()"
               aria-required="true"
               aria-describedby="err-login"/>
      </div>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label class="form-label" for="inp-pass" id="lbl-pass">Password</label>
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="inp-pass" class="form-input"
               placeholder="Your password"
               autocomplete="current-password"
               oninput="validateLogin()"
               aria-required="true"
               aria-describedby="err-login"/>
        <button class="eye-btn" id="eye-btn" type="button" aria-label="Show password"
                onclick="togglePass()">
          <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <span class="field-error" id="err-login" role="alert" aria-live="polite"></span>
    </div>

    <!-- Forgot password -->
    <div class="forgot-row">
      <a href="forgot.html" class="forgot-link" id="txt-forgot">Forgot password?</a>
    </div>

    <!-- Submit -->
    <button class="submit-btn" id="login-btn" onclick="doLogin()" disabled
            aria-disabled="true">
      <div class="btn-spinner" aria-hidden="true"></div>
      <span class="btn-text-wrap" style="display:flex;align-items:center;gap:8px">
        <span id="txt-login-btn">Log in</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </span>
    </button>

    <div class="auth-divider" aria-hidden="true">or</div>

    <p class="login-text" id="txt-no-account">
      Don't have an account? <a href="index.html">Sign up free</a>
    </p>

  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <div class="logo-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="footer-brand-text">
        <span class="footer-brand-name">Acron</span>
        <span class="footer-tagline">Free education for every Pakistani student</span>
      </div>
    </div>

    <nav class="footer-links" aria-label="Footer navigation">
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>

    <p class="footer-copyright">© 2026 Acron. All rights reserved.</p>
  </div>
</footer>


<script src="JS/config.js"></script>
<script src="JS/lang.js"></script>
<script src="JS/security.js"></script>
<script type="module" src="JS/firebase-config.js"></script>
<script type="module" src="JS/login.js"></script>
<script>
  if (typeof generateStars === 'function') generateStars();

  function togglePass() {
    const inp = document.getElementById('inp-pass');
    const btn = document.getElementById('eye-btn');
    const isHidden = inp.type === 'password';
    inp.type = isHidden ? 'text' : 'password';
    btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    btn.querySelector('svg').innerHTML = isHidden
      ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  }

  // Sync aria-disabled
  const _origValidate = window.validateLogin;
  window.validateLogin = function() {
    if (typeof _origValidate === 'function') _origValidate();
    const btn = document.getElementById('login-btn');
    if (btn) btn.setAttribute('aria-disabled', btn.disabled ? 'true' : 'false');
  };
</script>
<script src="JS/bug-report.js"></script>
</body>
</html>
