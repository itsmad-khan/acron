<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>acron — My Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="CSS/style.css"/>
</head>
<body>

<div class="stars" id="stars"></div>

<nav class="navbar">
  <div class="logo">
    <div class="logo-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div>
      <span class="logo-name">Acron</span></span>
      <span class="logo-urdu">علم کی راہ</span>
    </div>
  </div>
  <div class="nav-right">
    <div class="lang-switch">
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Switch theme">
        <svg id="theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>  
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Switch theme">
  <svg id="theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <svg id="theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/>
    <line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/>
    <line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
</button>
      <button class="lang-btn active" onclick="setLang('en')" id="btn-en">English</button>
      <button class="lang-btn" onclick="setLang('ur')" id="btn-ur">اردو</button>
    </div>
    <a href="dashboard.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Dashboard
    </a>
  </div>
</nav>

<main class="profile-main">

  <!-- Profile Card -->
  <div class="profile-top-card">
    <div class="profile-avatar" id="profile-avatar">A</div>
    <div class="profile-name-block">
      <h1 class="profile-name" id="profile-name">Ahmed Ali</h1>
      <p class="profile-board" id="profile-board">Balochistan Board — Class 12</p>
      <p class="profile-email" id="profile-email">ahmed@email.com</p>
    </div>
    <div class="profile-stats-mini">
      <div class="mini-stat">
        <div class="mini-num" id="mini-quizzes">0</div>
        <div class="mini-label">Quizzes</div>
      </div>
      <div class="mini-divider"></div>
      <div class="mini-stat">
        <div class="mini-num" id="mini-avg">—</div>
        <div class="mini-label">Avg Score</div>
      </div>
      <div class="mini-divider"></div>
      <div class="mini-stat">
        <div class="mini-num" id="mini-chapters">0</div>
        <div class="mini-label">Chapters</div>
      </div>
    </div>
  </div>

  <div class="profile-grid">

    <!-- Edit Info -->
    <div class="profile-card">
      <div class="profile-card-title" id="txt-edit-info">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Edit My Info
      </div>

      <div class="form-group">
        <label class="form-label">Full name</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="edit-name" class="form-input" placeholder="Your full name"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email address</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="edit-email" class="form-input" placeholder="Your email"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Board</label>
        <select id="edit-board" class="form-input" style="padding-left:14px">
          <option value="punjab">Punjab Board</option>
          <option value="federal">Federal Board</option>
          <option value="sindh">Sindh Board</option>
          <option value="kpk">KPK Board</option>
          <option value="balochistan">Balochistan Board</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Class</label>
        <select id="edit-class" class="form-input" style="padding-left:14px">
          <option value="9">Class 9</option>
          <option value="10">Class 10</option>
          <option value="11">Class 11</option>
          <option value="12">Class 12</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Study medium</label>
        <div class="medium-btns">
          <button class="medium-btn active" id="prof-med-en" onclick="setProfileMedium('english')" type="button">English</button>
          <button class="medium-btn" id="prof-med-ur" onclick="setProfileMedium('urdu')" type="button">اردو</button>
        </div>
      </div>

      <button class="submit-btn" onclick="saveProfile()" style="opacity:1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        <span>Save changes</span>
      </button>

      <div class="success-msg" id="save-success">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Profile saved successfully!
      </div>
    </div>

    <!-- Change Password -->
    <div class="profile-card">
      <div class="profile-card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Change Password
      </div>

      <div class="form-group">
        <label class="form-label">Current password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="old-pass" class="form-input" placeholder="Current password"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">New password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="new-pass" class="form-input" placeholder="New password — min 6 characters"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm new password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="new-pass2" class="form-input" placeholder="Repeat new password"/>
        </div>
      </div>

      <span class="field-error" id="pass-error"></span>

      <button class="submit-btn" onclick="changePassword()" style="opacity:1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>Update password</span>
      </button>

      <div class="success-msg" id="pass-success">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Password updated successfully!
      </div>

      <!-- Danger Zone -->
      <div class="danger-zone">
        <div class="danger-title">Danger zone</div>
        <p class="danger-sub">This will delete all your data — quizzes, progress, everything.</p>
        <button class="danger-btn" onclick="confirmDelete()">Delete my account</button>
      </div>
    </div>

  </div>
</main>

<script src="JS/lang.js"></script>
<script src="JS/profile.js"></script>
<script>generateStars(); initProfile();</script>
<script src="JS/config.js"></script>
</body>
</html>
