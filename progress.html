<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IlmPath — My Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="CSS/style.css"/>
</head>
<body>

<div class="stars" id="stars"></div>

<nav class="navbar">
  <div class="logo">
    <div class="logo-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div>
      <span class="logo-name">IlmPath</span>
      <span class="logo-urdu">علم کی راہ</span>
    </div>
  </div>
  <div class="nav-right">
    <div class="lang-switch">
      <button class="lang-btn active" onclick="setLang('en')" id="btn-en">English</button>
      <button class="lang-btn" onclick="setLang('ur')" id="btn-ur">اردو</button>
    </div>
    <a href="dashboard.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Dashboard
    </a>
  </div>
</nav>

<main class="progress-main">

  <div class="progress-header">
    <h1 class="progress-title">My Progress</h1>
    <p class="progress-sub" id="progress-sub">See how you are doing in every subject</p>
    <p class="progress-urdu">اپنی ترقی دیکھیں</p>
  </div>

  <!-- Overall Stats -->
  <div class="stats-row" style="margin-bottom:2rem">
    <div class="stat-card">
      <div class="stat-icon purple">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
      </div>
      <div class="stat-num" id="prog-total">0</div>
      <div class="stat-label">Total quizzes</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon teal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </div>
      <div class="stat-num" id="prog-avg">—</div>
      <div class="stat-label">Average score</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02
            12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>
      <div class="stat-num" id="prog-best">—</div>
      <div class="stat-label">Best score</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(248,113,113,0.12);color:#f87171">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div class="stat-num" id="prog-chapters">0</div>
      <div class="stat-label">Chapters read</div>
    </div>
  </div>

  <!-- Subject wise progress -->
  <div class="prog-section">
    <div class="prog-section-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      Score by subject
    </div>
    <div id="subject-bars"></div>
  </div>

  <!-- Full quiz history -->
  <div class="prog-section">
    <div class="prog-section-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      All quiz history
    </div>

    <div class="history-filters">
      <button class="filter-btn active" onclick="filterHistory('all', this)">All</button>
      <button class="filter-btn" onclick="filterHistory('Physics', this)">Physics</button>
      <button class="filter-btn" onclick="filterHistory('Chemistry', this)">Chemistry</button>
      <button class="filter-btn" onclick="filterHistory('Biology', this)">Biology</button>
      <button class="filter-btn" onclick="filterHistory('Mathematics', this)">Maths</button>
      <button class="filter-btn" onclick="filterHistory('English', this)">English</button>
    </div>

    <div id="full-history"></div>

    <div class="empty-state" id="no-history" style="display:none">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5">
        <path d="M9 11l3 3L22 4"/>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      <p>No quizzes yet. Go to a subject and start your first quiz!</p>
      <p style="color:#6c63ff;direction:rtl;margin-top:6px;font-size:13px;">
        ابھی تک کوئی کوئز نہیں
      </p>
    </div>
  </div>

</main>

<script src="JS/lang.js"></script>
<script src="JS/progress.js"></script>
<script>generateStars(); initProgress();</script>
<script src="JS/config.js"></script>
</body>
</html>
