<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>acron — Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="CSS/style.css"/>
<style>
  :root {
    --bg:           #0d0f1a;
    --bg-2:         #131629;
    --surface:      #1a1e32;
    --surface-2:    #1f2438;
    --border:       rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.13);
    --text-primary:   #f0f2ff;
    --text-secondary: #8b92b8;
    --text-muted:     #525878;
    --accent:       #7c6cf0;
    --accent-light: #9d90f5;
    --teal:         #34d399;
    --amber:        #fbbf24;
    --sidebar-w:    280px;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --transition: 200ms cubic-bezier(0.4,0,0.2,1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }

  /* ── Navbar ── */
  .navbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; height: 64px;
    background: rgba(13,15,26,0.9);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), #5b4dd4);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    color: #fff; box-shadow: 0 4px 12px rgba(124,108,240,0.4);
  }
  .logo-name { display: block; font-size: 17px; font-weight: 800; color: var(--text-primary); line-height: 1.1; letter-spacing: -0.3px; }
  .logo-urdu { display: block; font-size: 11px; color: var(--text-secondary); line-height: 1; }
  .nav-right { display: flex; align-items: center; gap: 8px; }
  .theme-toggle,
  .nav-icon-btn {
    width: 36px; height: 36px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-secondary); display: flex; align-items: center;
    justify-content: center; cursor: pointer; text-decoration: none;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
  }
  .theme-toggle:hover,
  .nav-icon-btn:hover { background: var(--surface-2); color: var(--text-primary); border-color: var(--border-hover); }
  .lang-switch {
    display: flex; background: var(--surface);
    border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px;
  }
  .lang-btn {
    padding: 4px 12px; border-radius: 6px; border: none;
    background: transparent; color: var(--text-secondary);
    font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background var(--transition), color var(--transition);
  }
  .lang-btn.active { background: var(--accent); color: #fff; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-secondary); font-size: 13px; font-weight: 700;
    text-decoration: none; min-height: 36px;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
  }
  .back-link:hover { background: var(--surface-2); color: var(--text-primary); border-color: var(--border-hover); }

  /* ── Reader layout ── */
  .reader-main {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    height: calc(100vh - 64px);
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .reader-left {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .book-header {
    display: flex; align-items: center; gap: 12px;
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .book-cover-icon {
    width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
    background: rgba(124,108,240,0.12);
    border: 1px solid rgba(124,108,240,0.2);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-light);
  }

  .book-title {
    font-size: 15px; font-weight: 800;
    color: var(--text-primary); line-height: 1.2; letter-spacing: -0.2px;
  }
  .book-meta {
    font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 2px;
  }

  .chapters-label {
    padding: 14px 18px 8px;
    font-size: 11px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.8px;
    flex-shrink: 0;
  }

  .chapters-list {
    flex: 1; overflow-y: auto; padding: 0 10px 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .chapters-list::-webkit-scrollbar { width: 4px; }
  .chapters-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Chapter item — rendered by reader.js */
  .chapter-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 10px; border-radius: var(--radius-sm);
    cursor: pointer; color: var(--text-secondary);
    font-size: 13px; font-weight: 600; line-height: 1.35;
    transition: background var(--transition), color var(--transition);
    min-height: 44px;
    text-decoration: none;
  }
  .chapter-item:hover { background: var(--surface-2); color: var(--text-primary); }
  .chapter-item.active {
    background: rgba(124,108,240,0.12);
    color: var(--accent-light);
  }
  .chapter-num {
    width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
    background: var(--surface-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800; color: var(--text-muted);
    transition: background var(--transition), color var(--transition);
  }
  .chapter-item.active .chapter-num {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }

  /* ── Reader right panel ── */
  .reader-right {
    display: flex; flex-direction: column;
    overflow: hidden; background: var(--bg);
  }

  /* ── Pick chapter placeholder ── */
  .chapter-view {
    flex: 1; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  .pick-chapter-state {
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; text-align: center; color: var(--text-muted); padding: 32px;
  }
  .pick-chapter-state svg { opacity: 0.4; }
  .pick-chapter-state p { font-size: 15px; font-weight: 600; max-width: 280px; line-height: 1.5; }
  .pick-urdu { font-size: 13px; direction: rtl; color: var(--text-muted); opacity: 0.7; }

  /* ── Reader toolbar ── */
  .reader-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; flex-wrap: wrap; gap: 8px;
    min-height: 52px;
  }

  .toolbar-left { display: flex; align-items: center; gap: 8px; }

  .current-chapter-name {
    font-size: 13px; font-weight: 700; color: var(--text-secondary);
    max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Chapter progress pill */
  .chapter-progress-pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(52,211,153,0.08);
    border: 1px solid rgba(52,211,153,0.18);
    color: var(--teal); padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700;
  }

  .toolbar-right { display: flex; align-items: center; gap: 6px; }

  .toolbar-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    height: 32px; padding: 0 12px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text-secondary); font-family: 'Nunito', sans-serif;
    font-size: 12px; font-weight: 800; cursor: pointer; text-decoration: none;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
    white-space: nowrap;
  }
  .toolbar-btn:hover { background: var(--bg-2); color: var(--text-primary); border-color: var(--border-hover); }

  .quiz-from-chapter {
    background: rgba(124,108,240,0.1);
    border-color: rgba(124,108,240,0.25);
    color: var(--accent-light);
  }
  .quiz-from-chapter:hover {
    background: rgba(124,108,240,0.18);
    border-color: var(--accent);
    color: var(--accent-light);
  }

  /* ── PDF frame ── */
  .pdf-frame-wrap {
    flex: 1; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .pdf-frame {
    width: 100%; height: 100%; border: none;
    background: var(--bg-2);
  }

  /* ── Mobile sidebar toggle ── */
  .sidebar-toggle {
    display: none;
    position: fixed; bottom: 24px; left: 20px; z-index: 200;
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--accent); color: #fff; border: none;
    box-shadow: 0 4px 16px rgba(124,108,240,0.5);
    align-items: center; justify-content: center; cursor: pointer;
    transition: transform var(--transition), box-shadow var(--transition);
  }
  .sidebar-toggle:hover { transform: scale(1.08); box-shadow: 0 6px 22px rgba(124,108,240,0.6); }

  /* ── Light mode ── */
  body.light-mode {
    --bg: #f4f6fb; --bg-2: #eef0f7; --surface: #ffffff; --surface-2: #f0f2fa;
    --border: rgba(0,0,0,0.08); --border-hover: rgba(0,0,0,0.14);
    --text-primary: #1a1d2e; --text-secondary: #5a6080; --text-muted: #9ba3c0;
  }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .reader-main { grid-template-columns: 1fr; }

    .reader-left {
      position: fixed; left: 0; top: 64px; bottom: 0;
      width: var(--sidebar-w); z-index: 150;
      transform: translateX(-100%);
      transition: transform var(--transition);
      box-shadow: 4px 0 24px rgba(0,0,0,0.4);
    }
    .reader-left.open { transform: translateX(0); }

    .sidebar-toggle { display: flex; }
    .navbar { padding: 0 16px; }
    .reader-toolbar { padding: 8px 14px; }
    .current-chapter-name { max-width: 160px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<nav class="navbar" role="navigation" aria-label="Main navigation">
  <a href="dashboard.html" class="logo" aria-label="Acron home">
    <div class="logo-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div>
      <span class="logo-name">Acron</span>
      <span class="logo-urdu">علم کی راہ</span>
    </div>
  </a>
  <div class="nav-right">
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
      <svg id="theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg id="theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none" aria-hidden="true">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
    <div class="lang-switch" role="group" aria-label="Language">
      <button class="lang-btn active" onclick="setLang('en')" id="btn-en" aria-pressed="true">English</button>
      <button class="lang-btn" onclick="setLang('ur')" id="btn-ur" aria-pressed="false">اردو</button>
    </div>
    <a href="progress.html" class="nav-icon-btn" aria-label="My Progress">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </a>
    <a href="profile.html" class="nav-icon-btn" aria-label="My Profile">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </a>
    <a href="dashboard.html" class="back-link" aria-label="Back to Dashboard">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Dashboard
    </a>
  </div>
</nav>

<main class="reader-main" id="main-content">

  <!-- Sidebar -->
  <aside class="reader-left" id="reader-left" aria-label="Chapter list">
    <div class="book-header">
      <div class="book-cover-icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div>
        <div class="book-title" id="book-title">Physics</div>
        <div class="book-meta" id="book-meta">Class 12 — Balochistan Board</div>
      </div>
    </div>

    <div class="chapters-label" id="txt-chapters" aria-hidden="true">Chapters</div>

    <!-- reader.js renders .chapter-item elements here.
         Recommended structure per item:
         <button class="chapter-item active" onclick="openChapter(N)" aria-current="true">
           <span class="chapter-num">1</span>
           Chapter name here
         </button>
    -->
    <nav class="chapters-list" id="chapters-list" aria-label="Chapters"></nav>
  </aside>

  <!-- Right panel -->
  <div class="reader-right" id="reader-right">

    <!-- Pick chapter placeholder -->
    <div class="chapter-view" id="chapter-view">
      <div class="pick-chapter-state" role="status">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <p id="txt-pick-chapter">Pick a chapter from the left to start reading</p>
        <p class="pick-urdu">بائیں طرف سے باب منتخب کریں</p>
      </div>
    </div>

    <!-- Toolbar (shown when chapter is open) -->
    <div class="reader-toolbar" id="reader-toolbar" style="display:none"
         role="toolbar" aria-label="Reading controls">
      <div class="toolbar-left">
        <span class="current-chapter-name" id="current-chapter-name" aria-live="polite"></span>
        <span class="chapter-progress-pill" id="chapter-progress-pill" style="display:none">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span id="chapter-progress-text">Read</span>
        </span>
      </div>
      <div class="toolbar-right">
        <button class="toolbar-btn" onclick="changeFont(-1)" aria-label="Decrease font size">A−</button>
        <button class="toolbar-btn" onclick="changeFont(1)"  aria-label="Increase font size">A+</button>
        <button class="toolbar-btn" onclick="toggleDark()" id="dark-btn" aria-label="Toggle dark mode">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <a class="toolbar-btn quiz-from-chapter" id="btn-quiz-chapter" href="quiz.html"
           aria-label="Take a quiz on this chapter">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
          <span id="txt-quiz-this">Quiz this chapter</span>
        </a>
      </div>
    </div>

    <!-- PDF iframe -->
    <div class="pdf-frame-wrap" id="pdf-frame-wrap" style="display:none">
      <iframe id="pdf-frame" class="pdf-frame" src="" allowfullscreen
              title="Chapter PDF viewer" aria-label="PDF reader"></iframe>
    </div>

  </div>
</main>

<!-- Mobile sidebar toggle -->
<button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle chapter list"
        onclick="document.getElementById('reader-left').classList.toggle('open')">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
    <line x1="3" y1="6" x2="21" y2="6"/>
    <line x1="3" y1="12" x2="21" y2="12"/>
    <line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
</button>

<script src="JS/lang.js"></script>
<script src="JS/reader.js"></script>
<script src="JS/config.js"></script>
<script>
  if (typeof generateStars === 'function') generateStars();
  if (typeof initReader   === 'function') initReader();

  // Close sidebar when tapping outside on mobile
  document.addEventListener('click', function(e) {
    const sidebar = document.getElementById('reader-left');
    const toggle  = document.getElementById('sidebar-toggle');
    if (sidebar && toggle &&
        !sidebar.contains(e.target) &&
        !toggle.contains(e.target) &&
        sidebar.classList.contains('open')) {
      sidebar.classList.remove('open');
    }
  });
</script>
<script src="JS/bug-report.js"></script>
</body>
</html>
