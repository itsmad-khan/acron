<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Acron — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="CSS/style.css"/>
</head>
<body>

<div class="stars" id="stars"></div>

<nav class="navbar">
  <div class="logo">
    <div class="logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
    <div>
      <span class="logo-name">Acron</span></span>
      <span class="logo-urdu">علم کی راہ</span>
    </div>
  </div>
  <div class="nav-right">
    <div class="lang-switch">
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Switch theme">
        <svg id="theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <button class="lang-btn active" onclick="setLang('en')" id="btn-en">English</button>
      <button class="lang-btn" onclick="setLang('ur')" id="btn-ur">اردو</button>
    </div>
  </div>
</nav>

<main class="auth-main">
  <div class="auth-card">

    <div class="auth-top">
      <div class="auth-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <h2 class="auth-title" id="txt-signup-title">Create your free account</h2>
      <p class="auth-sub" id="txt-signup-sub">Start studying in less than 1 minute</p>
    </div>

    <div class="selected-info" id="selected-info">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="selected-text">Balochistan Board — Class 12</span>
    </div>

    <div class="form-group">
      <label class="form-label" id="lbl-name">Your full name</label>
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="inp-name" class="form-input" placeholder="e.g. Ahmed Ali"/>
      </div>
      <span class="field-error" id="err-name"></span>
    </div>
    
    <div class="form-group">
      <label class="form-label" id="lbl-email">Email address</label>
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <input type="email" id="inp-email" class="form-input" placeholder="your@email.com"/>
      </div>
      <span class="field-error" id="err-email"></span>
    </div>
    
    <div class="form-group">
      <label class="form-label" id="lbl-pass">Password</label>
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="inp-pass" class="form-input" placeholder="Min 6 characters"/>
        <button class="eye-btn" id="eye-btn" type="button" aria-label="Show password">
          <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="strength-bar">
        <div class="strength-fill" id="strength-fill"></div>
      </div>
      <span class="strength-label" id="strength-label"></span>
      <span class="field-error" id="err-pass"></span>
    </div>
    
    <div class="form-group">
      <label class="form-label" id="lbl-pass2">Confirm password</label>
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="inp-pass2" class="form-input" placeholder="Repeat your password"/>
      </div>
      <span class="field-error" id="err-pass2"></span>
    </div>

    <div class="medium-select-row">
      <span class="form-label" id="lbl-medium">Study medium</span>
      <div class="medium-btns">
        <button class="medium-btn active" id="med-en" onclick="setMedium('english')" type="button">English</button>
        <button class="medium-btn" id="med-ur" onclick="setMedium('urdu')" type="button">اردو</button>
      </div>
    </div>

    <button class="submit-btn" id="signup-btn" onclick="doSignup()" disabled>
      <span id="txt-create">Create my account</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>

    <div class="success-msg" id="success-msg">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="txt-success">Account created! Going to your dashboard...</span>
    </div>

    <p class="login-text" id="txt-have-account">Already have an account? <a href="login.html" id="txt-login-link">Log in here</a></p>
  </div>
</main>

<script src="JS/config.js"></script>
<script src="JS/lang.js"></script>
<script src="JS/security.js"></script>
<script type="module" src="JS/firebase-config.js"></script>
<script type="module" src="JS/signup.js"></script>
<script>generateStars();</script>
</body>
</html>
